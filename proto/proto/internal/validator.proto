// Specification of the user facing gRPC API.
syntax = "proto3";
package validator;

import "types/transaction.proto";
import "types/blockchain.proto";
import "types/primitives.proto";
import "google/protobuf/empty.proto";

// VALIDATOR API
// ================================================================================================

// Validator API for the Validator component.
service Api {
   // Returns the status info of the validator.
   rpc Status(google.protobuf.Empty) returns (ValidatorStatus) {}

   // Submits a transaction to the validator.
   rpc SubmitProvenTransaction(transaction.ProvenTransaction) returns (google.protobuf.Empty) {}

   // Returns the signed private-transaction submission key descriptor.
   rpc GetSubmissionKey(google.protobuf.Empty) returns (PrivateTxSubmissionKey) {}

   // Rotates the private-transaction submission key and returns the new signed descriptor.
   rpc RotateSubmissionKey(RotateSubmissionKeyRequest) returns (PrivateTxSubmissionKey) {}

   // Fetches an encrypted private transaction archive record by transaction ID.
   //
   // The returned record is encrypted; access control is enforced by the threshold audit ceremony,
   // not by this endpoint.
   rpc GetPrivateTxArchiveRecord(PrivateTxArchiveRecordRequest) returns (PrivateTxArchiveRecord) {}

   // Validates a proposed block and returns the block header and body.
   rpc SignBlock(blockchain.ProposedBlock) returns (blockchain.BlockSignature) {}
}

// PRIVATE TRANSACTIONS
// ================================================================================================

// Signed private transaction submission key descriptor.
message PrivateTxSubmissionKey {
    // Encoded using [miden_node_private_tx::SignedSubmissionKey::to_bytes].
    bytes signed_key = 1;
}

// Manual private transaction submission-key rotation request.
message RotateSubmissionKeyRequest {
    // First block for which the new key descriptor is valid.
    fixed32 valid_from = 1;

    // Last block for which the new key descriptor is valid.
    fixed32 valid_until = 2;

    // First block at which the previous key is no longer accepted.
    fixed32 destroy_previous_at = 3;
}

// Request for a private transaction archive record.
message PrivateTxArchiveRecordRequest {
    // ID of the transaction whose archive record should be returned.
    transaction.TransactionId transaction_id = 1;
}

// Encrypted private transaction archive record.
message PrivateTxArchiveRecord {
    // Encoded using [miden_node_private_tx::EncryptedPrivateTxRecord::to_bytes].
    bytes record = 1;
}

// VALIDATOR STATUS
// ================================================================================================

// Represents the status of the validator.
message ValidatorStatus {
    // The validator's running version.
    string version = 1;

    // The validator's status.
    string status = 2;

    // The validator's current chain tip (highest signed block number).
    fixed32 chain_tip = 3;

    // The total number of transactions validated by this validator.
    fixed64 validated_transactions_count = 4;

    // The total number of blocks signed by this validator.
    fixed64 signed_blocks_count = 5;
}
